# .github/workflows/update-gcp-linux.yml  (or your fetch-gcp-linux workflow)
name: Fetch GCP Prices (Linux-only, parallel)

env:
  # Optional: run JS actions under Node 24 now (silence deprecation warning)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      run_id:
        description: "Run ID of this reusable workflow execution"
        value: ${{ github.run_id }}
  workflow_dispatch: {}

concurrency:
  group: provider-gcp-linux
  cancel-in-progress: true

jobs:
  fetch-gcp-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'   # OK; actions will run under Node 24 due to env flag above

      - name: Ensure jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

      # ✅ FIX: supply exactly one auth method (here: credentials_json)
      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}   # <-- REQUIRED
          export_environment_variables: true
          cleanup_credentials: true
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Export access token for REST calls
        run: echo "GCLOUD_ACCESS_TOKEN=$(gcloud auth print-access-token)" >> $GITHUB_ENV

      - name: Ensure output dirs
        run: |
          mkdir -p data
          mkdir -p docs/data/gcp

      - name: Fetch GCP discovery & catalog (parallel path)
        run: node scripts/providers/gcp.linux.fetch.js
        env:
          # 👇 Your project ID for discovery calls
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

          # Region(s)
          GCP_REGIONS: "us-east1"

          # 👇 API key for the Cloud Billing Catalog API (public pricing)
          GCP_BILLING_API_KEY: ${{ secrets.GCP_BILLING_API_KEY }}

          # Output files (parallel artifacts)
          GCP_MACHINE_TYPES_FILE: "data/gcp-linux-machine-types.json"
          GCP_CATALOG_FILE: "data/gcp-linux-catalog.json"

      - name: Compose GCP Linux base (validation JSON)
        run: node scripts/gcp.linux.js
        env:
          GCP_REGIONS: "us-east1"
          GCP_MACHINE_TYPES_FILE: "data/gcp-linux-machine-types.json"
          GCP_CATALOG_FILE: "data/gcp-linux-catalog.json"
          GCP_OUTPUT_FILE: "docs/data/gcp/gcp.linux.prices.json"

      - name: Validate validation-output
        run: |
          set -euo pipefail
          test -s docs/data/gcp/gcp.linux.prices.json
          echo "Count (Linux rows):"
          jq '[.[] | select(.os=="Linux")] | length' docs/data/gcp/gcp.linux.prices.json
          echo "Probes (us-east1):"
          jq -r '.[] | select(.region=="us-east1" and .os=="Linux" and (.instance=="n2d-standard-4" or .instance=="c2d-standard-4")) | "\(.instance) => \(.pricePerHourUSD)"' docs/data/gcp/gcp.linux.prices.json

      - name: Upload GCP Linux validation JSON (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: gcp-linux-prices
          path: docs/data/gcp/gcp.linux.prices.json
          if-no-files-found: error
          retention-days: 7
