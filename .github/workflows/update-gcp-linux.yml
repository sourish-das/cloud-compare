name: Fetch GCP Prices (Linux-only, parallel)

env:
  # Optional: run JS actions under Node 24 (silences Node 20 deprecation notice)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      run_id:
        description: "Run ID of this reusable workflow execution"
        value: ${{ github.run_id }}
  workflow_dispatch: {}

concurrency:
  group: provider-gcp-linux
  cancel-in-progress: true

jobs:
  fetch-gcp-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # ------------------------------------------------------------
      # Checkout (read-only)
      # ------------------------------------------------------------
      - name: Checkout repo (read-only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # Node setup
      # ------------------------------------------------------------
      - name: Set up Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ------------------------------------------------------------
      # jq (for quick validation)
      # ------------------------------------------------------------
      - name: Ensure jq (for quick validation)
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

      # ------------------------------------------------------------
      # Decide auth mode dynamically based on available secrets
      # ------------------------------------------------------------
      - name: Decide GCP auth mode
        id: authmode
        shell: bash
        run: |
          set -euo pipefail
          has_wif_provider="${{ secrets.GCP_WIF_PROVIDER != '' }}"
          has_wif_sa="${{ secrets.GCP_WIF_SERVICE_ACCOUNT != '' }}"
          has_sa_key="${{ secrets.GCP_SA_KEY != '' }}"

          if [[ "$has_wif_provider" == "true" && "$has_wif_sa" == "true" ]]; then
            echo "mode=wif" >> "$GITHUB_OUTPUT"
            echo "Auth mode: Workload Identity Federation"
          elif [[ "$has_sa_key" == "true" ]]; then
            echo "mode=sa" >> "$GITHUB_OUTPUT"
            echo "Auth mode: Service Account JSON"
          else
            echo "::error::No Google Cloud auth configured. Provide either:
              1) secrets.GCP_WIF_PROVIDER + secrets.GCP_WIF_SERVICE_ACCOUNT (WIF), or
              2) secrets.GCP_SA_KEY (Service Account JSON)."
            exit 1
          fi

      # ------------------------------------------------------------
      # Authenticate to Google Cloud (exactly one of WIF or SA key)
      # ------------------------------------------------------------
      - name: Auth via Workload Identity Federation
        if: ${{ steps.authmode.outputs.mode == 'wif' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
          export_environment_variables: true
          cleanup_credentials: true
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Auth via Service Account JSON
        if: ${{ steps.authmode.outputs.mode == 'sa' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          export_environment_variables: true
          cleanup_credentials: true
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Export access token for REST calls
        run: echo "GCLOUD_ACCESS_TOKEN=$(gcloud auth print-access-token)" >> $GITHUB_ENV

      # ------------------------------------------------------------
      # Ensure output dirs
      # ------------------------------------------------------------
      - name: Ensure output directories
        run: |
          mkdir -p data
          mkdir -p docs/data/gcp

      # ------------------------------------------------------------
      # Fetch discovery (machine types) & Catalog SKUs
      #   - discovery uses Compute machineTypes.list (OAuth)
      #   - catalog uses Cloud Billing Catalog API (API key)
      # ------------------------------------------------------------
      - name: Fetch GCP discovery & catalog (Linux-only inputs)
        run: node scripts/providers/gcp.linux.fetch.js
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGIONS: "us-east1"
          GCP_BILLING_API_KEY: ${{ secrets.GCP_BILLING_API_KEY }}
          GCP_MACHINE_TYPES_FILE: "data/gcp-linux-machine-types.json"
          GCP_CATALOG_FILE: "data/gcp-linux-catalog.json"

      # ------------------------------------------------------------
      # Compose validation output (Linux OSS only)
      # ------------------------------------------------------------
      - name: Compose GCP Linux base (validation JSON)
        run: node scripts/gcp.linux.js
        env:
          GCP_REGIONS: "us-east1"
          GCP_MACHINE_TYPES_FILE: "data/gcp-linux-machine-types.json"
          GCP_CATALOG_FILE: "data/gcp-linux-catalog.json"
          GCP_OUTPUT_FILE: "docs/data/gcp/gcp.linux.prices.json"

      # ------------------------------------------------------------
      # Validate & probe a couple of shapes in logs
      # ------------------------------------------------------------
      - name: Validate validation-output
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/data/gcp/gcp.linux.prices.json
          echo "Count (Linux rows):"
          jq '[.[] | select(.os=="Linux")] | length' docs/data/gcp/gcp.linux.prices.json
          echo "Probes (us-east1):"
          jq -r '.[] | select(.region=="us-east1" and .os=="Linux" and (.instance=="n2d-standard-4" or .instance=="c2d-standard-4")) | "\(.instance) => \(.pricePerHourUSD)"' docs/data/gcp/gcp.linux.prices.json

      # ------------------------------------------------------------
      # Upload artifact for orchestrator / manual inspection
      # ------------------------------------------------------------
      - name: Upload GCP Linux validation JSON (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: gcp-linux-prices
          path: docs/data/gcp/gcp.linux.prices.json
          if-no-files-found: error
          retention-days: 7
