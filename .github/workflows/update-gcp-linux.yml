name: Fetch GCP Prices (Linux-only, parallel)

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      run_id:
        description: "Run ID of this reusable workflow execution"
        value: ${{ github.run_id }}
  workflow_dispatch: {}

concurrency:
  group: provider-gcp-linux
  cancel-in-progress: true

jobs:
  fetch-gcp-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repo (read-only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure jq (for quick validation)
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

      # --- GCP auth for discovery (Compute API) ---
      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Export access token for REST calls
        run: echo "GCLOUD_ACCESS_TOKEN=$(gcloud auth print-access-token)" >> $GITHUB_ENV

      - name: Ensure output dirs
        run: |
          mkdir -p data
          mkdir -p docs/data/gcp

      # --- Fetch discovery + catalog (Linux-only inputs) ---
      - name: Fetch GCP discovery & catalog (parallel path)
        run: node scripts/providers/gcp.linux.fetch.js
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGIONS: "us-east1"
          GCP_BILLING_API_KEY: ${{ secrets.GCP_BILLING_API_KEY }}
          GCP_MACHINE_TYPES_FILE: "data/gcp-linux-machine-types.json"
          GCP_CATALOG_FILE: "data/gcp-linux-catalog.json"

      # --- Compose Linux-only validation output ---
      - name: Compose GCP Linux base (validation JSON)
        run: node scripts/gcp.linux.js
        env:
          GCP_REGIONS: "us-east1"
          GCP_MACHINE_TYPES_FILE: "data/gcp-linux-machine-types.json"
          GCP_CATALOG_FILE: "data/gcp-linux-catalog.json"
          GCP_OUTPUT_FILE: "docs/data/gcp/gcp.linux.prices.json"

      # --- Validate presence and show quick stats ---
      - name: Validate validation-output
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/data/gcp/gcp.linux.prices.json
          echo "Output size:"
          wc -c docs/data/gcp/gcp.linux.prices.json
          echo "Sample (us-east1, Linux):"
          jq -r '.[] | select(.region=="us-east1") | .instance' docs/data/gcp/gcp.linux.prices.json | head -n 15
          echo "Count (Linux rows):"
          jq '[.[] | select(.os=="Linux")] | length' docs/data/gcp/gcp.linux.prices.json || true

      # --- Upload artifact for orchestrator / manual inspection ---
      - name: Upload GCP Linux validation JSON (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: gcp-linux-prices
          path: docs/data/gcp/gcp.linux.prices.json
          if-no-files-found: error
          retention-days: 7

      # --- Optional debug publish (does NOT overwrite canonical files) ---
      - name: Debug Publish to docs/data (optional)
        if: ${{ vars.DEBUG_PUBLISH == 'true' }}
        run: |
          set -euo pipefail
          echo "DEBUG MODE ENABLED: Publishing parallel GCP Linux output directly"
          mkdir -p docs/data/gcp/_debug
          cp -f docs/data/gcp/gcp.linux.prices.json docs/data/gcp/_debug/gcp.linux.prices.json

      - name: Commit debug provider files (optional)
        if: ${{ vars.DEBUG_PUBLISH == 'true' }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git add -f docs/data/gcp/_debug/gcp.linux.prices.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Debug publish: GCP Linux validation pricing (parallel path)"
          git push
