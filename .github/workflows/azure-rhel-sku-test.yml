name: Azure RHEL SKU Test (Isolated)

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch: {}
  workflow_call:
    outputs:
      run_id:
        description: "Run ID of this workflow execution"
        value: ${{ github.run_id }}

concurrency:
  group: provider-azure-rhel-test
  cancel-in-progress: true

jobs:
  fetch-azure-rhel:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo (read-only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure jq (for quick validation)
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate ARM Token
        shell: bash
        run: |
          set -euo pipefail
          ARM_TOKEN=$(az account get-access-token \
            --resource https://management.azure.com/ \
            --query accessToken -o tsv)
          if [[ -z "${ARM_TOKEN}" ]]; then
            echo "::error::Failed to acquire ARM token via OIDC."
            exit 1
          fi
          echo "ARM_TOKEN=${ARM_TOKEN}" >> "$GITHUB_ENV"

      - name: Ensure output directory
        run: mkdir -p docs/data/azure/_test

      - name: Fetch Azure RHEL prices (test)
        run: node scripts/providers/azure.fetch.rhel.test.js
        env:
          ARM_TOKEN: ${{ env.ARM_TOKEN }}
          AZURE_REGION: "eastus"
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          OUTPUT_PATH: "docs/data/azure/_test/azure.rhel.prices.json"
          AZURE_LINUX_VARIANT: "rhel"

      - name: Validate RHEL output (jq)
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/data/azure/_test/azure.rhel.prices.json
          echo "Top-level keys:"
          jq 'keys' docs/data/azure/_test/azure.rhel.prices.json
          echo "Length:"
          jq '.compute | length' docs/data/azure/_test/azure.rhel.prices.json
          echo "Sample rows:"
          jq -r '.compute | .[0:8] | map({instance,displayInstance,seriesName,os,linuxVariant,pricePerHourUSD})' docs/data/azure/_test/azure.rhel.prices.json

      - name: Upload artifact (azure-rhel-sku-test)
        uses: actions/upload-artifact@v4
        with:
          name: azure-rhel-sku-test
          path: docs/data/azure/_test/azure.rhel.prices.json
          if-no-files-found: error
          retention-days: 7
