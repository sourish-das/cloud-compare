name: Update All Cloud Prices

permissions:
  contents: write
  actions: read   # allow reading artifacts from child reusable workflows

on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 0 * * 1"   # Monday 00:30 UTC

concurrency:
  group: update-all-cloud-prices
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------
  # 1) Azure
  # ------------------------------------------------------------
  azure:
    uses: ./.github/workflows/update-azure.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  # ------------------------------------------------------------
  # 2) AWS
  # ------------------------------------------------------------
  aws:
    needs: azure
    uses: ./.github/workflows/update-aws.yml
    permissions:
      contents: read
    secrets: inherit

  # ------------------------------------------------------------
  # 3) GCP
  # ------------------------------------------------------------
  gcp:
    needs: aws
    uses: ./.github/workflows/update-gcp.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  # ------------------------------------------------------------
  # 4) OCI  ✅ FIXED
  # ------------------------------------------------------------
  oci:
    needs: gcp
    uses: ./.github/workflows/update-oci.yml
    permissions:
      contents: read
    secrets: inherit

  # ------------------------------------------------------------
  # 5) Aggregate & Commit
  # ------------------------------------------------------------
  aggregate:
    needs: [azure, aws, gcp, oci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align working tree to origin/main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

      # (rest of aggregate job unchanged)
