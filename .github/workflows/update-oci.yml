name: Fetch OCI Prices

permissions:
  contents: read        # provider does not commit; orchestrator will

on:
  workflow_call:
    outputs:
      run_id:
        description: "Run ID of this reusable workflow execution"
        value: ${{ github.run_id }}
  workflow_dispatch: {}

concurrency:
  group: provider-oci
  cancel-in-progress: true

jobs:
  fetch-oci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ------------------------------------------------------------
      # Checkout (read-only)
      # ------------------------------------------------------------
      - name: Checkout repo (read-only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # Node setup (LTS)
      # ------------------------------------------------------------
      - name: Set up Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ------------------------------------------------------------
      # jq (for quick validation)
      # ------------------------------------------------------------
      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

      # ------------------------------------------------------------
      # Pre-flight & output dir
      # ------------------------------------------------------------
      - name: Pre-flight checks
        shell: bash
        env:
          OCI_REGION: "us-ashburn-1"
        run: |
          set -euo pipefail
          echo "== Pre-flight =="
          echo "Region: ${OCI_REGION}"
          mkdir -p docs/data/oci

      # ------------------------------------------------------------
      # Generate OCI prices (LIVE -> LAST-COMMIT -> DEFAULTS)
      # ------------------------------------------------------------
      - name: Fetch OCI prices (live->fallback)
        run: node scripts/providers/oci.fetch.js
        env:
          OCI_REGION: "us-ashburn-1"
          OUTPUT_PATH: "docs/data/oci/oci.prices.json"

      # ------------------------------------------------------------
      # Validate generated output
      # ------------------------------------------------------------
      - name: Validate OCI output
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/data/oci/oci.prices.json
          echo "Output size (bytes):"
          wc -c docs/data/oci/oci.prices.json
          echo "Top-level keys:"
          jq 'keys' docs/data/oci/oci.prices.json | sed 's/^/  /' || true
          echo "Presence checks:"
          jq -e '.compute.linux.amd | length > 0' docs/data/oci/oci.prices.json >/dev/null || { echo "::error::linux.amd is empty"; exit 1; }
          jq -e '.compute.linux.arm | length > 0' docs/data/oci/oci.prices.json >/dev/null || { echo "::error::linux.arm is empty"; exit 1; }
          # intel may be empty in some regions; do not fail on it
          echo "Storage block:"
          jq '.storage' docs/data/oci/oci.prices.json

      # ------------------------------------------------------------
      # Sanity: Windows hourly > Linux hourly for a canonical x86 sample
      # (Rewritten using Python for robust float math & error handling)
      # ------------------------------------------------------------
      - name: Sanity: Windows hourly should exceed Linux hourly (2 vCPU / 4 GB)
        shell: bash
        run: |
          set -euo pipefail
          J=docs/data/oci/oci.prices.json

          # Prefer AMD as canonical x86; fallback to Intel if AMD absent
          CPU_RATE=$(jq -r '.compute.linux.amd[0].ocpu_per_hour // .compute.linux.intel[0].ocpu_per_hour' "$J")
          MEM_RATE=$(jq -r '.compute.linux.amd[0].ram_gb_per_hour // .compute.linux.intel[0].ram_gb_per_hour' "$J")
          WIN_LIC=$(jq -r '.compute.windows.license_per_vcpu_hour' "$J")

          if [ -z "$CPU_RATE" ] || [ "$CPU_RATE" = "null" ]; then
            echo "::error::Missing x86 ocpu_per_hour in AMD/Intel arrays"
            exit 1
          fi
          if [ -z "$MEM_RATE" ] || [ "$MEM_RATE" = "null" ]; then
            echo "::error::Missing x86 ram_gb_per_hour in AMD/Intel arrays"
            exit 1
          fi
          if [ -z "$WIN_LIC" ] || [ "$WIN_LIC" = "null" ]; then
            echo "::warning::Windows license_per_vcpu_hour missing/null; treating as 0 for sanity check"
            WIN_LIC=0
          fi

          VCPU=2
          RAM=4

          python - <<'PY'
import os, sys
def f(env, key):
    v = os.environ.get(key, "")
    try:
        return float(v)
    except Exception:
        print(f"::error::{key} is not a valid number: {v!r}")
        sys.exit(1)

cpu = f(os.environ, "CPU_RATE")
mem = f(os.environ, "MEM_RATE")
lic = f(os.environ, "WIN_LIC")
vcpu = f(os.environ, "VCPU")
ram  = f(os.environ, "RAM")

# x86 mapping: 1 OCPU = 2 vCPU
ocpu = vcpu / 2.0

linux = ocpu * cpu + ram * mem
windows = linux + vcpu * lic

print(f"Linux/hr={linux:.6f}  Windows/hr={windows:.6f}  (x86, 2 vCPU, 4 GiB)")
if not (windows > linux):
    print("::error::Expected Windows > Linux for sample x86 shape")
    sys.exit(1)
PY

      # ------------------------------------------------------------
      # Upload artifact (for update-all.yml)
      # ------------------------------------------------------------
      - name: Upload OCI pricing JSON (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: oci-prices
          path: docs/data/oci/oci.prices.json
          if-no-files-found: error
          retention-days: 7

      # =========================================
      # OPTIONAL DEBUG MODE — snapshot to docs/data (no direct overwrite)
      # =========================================
      - name: Debug Publish to docs/data (optional)
        if: ${{ vars.DEBUG_PUBLISH == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "DEBUG MODE ENABLED: Snapshotting OCI output under docs/data/oci/_debug"
          mkdir -p docs/data/oci/_debug
          cp -f docs/data/oci/oci.prices.json docs/data/oci/_debug/oci.prices.json

      - name: Commit debug provider files (optional)
        if: ${{ vars.DEBUG_PUBLISH == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          git add -f docs/data/oci/oci.prices.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Debug publish: OCI pricing update"
          git push
