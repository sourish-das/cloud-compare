name: Fetch OCI Prices

permissions:
  contents: read
  id-token: write

on:
  workflow_call:
    outputs:
      run_id:
        description: "Run ID of this reusable workflow execution"
        value: ${{ github.run_id }}
  workflow_dispatch: {}

concurrency:
  group: provider-oci
  cancel-in-progress: true

jobs:
  fetch-oci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ensure jq (for quick validation)
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

      - name: Show config (debug)
        run: |
          echo "Region:   $OCI_REGION"
          echo "Node:     $(node -v)"
        env:
          OCI_REGION: "us-ashburn-1"

      - name: Pre-flight checks
        shell: bash
        env:
          OCI_REGION: "us-ashburn-1"
        run: |
          set -euo pipefail
          echo "== Pre-flight =="
          echo "Region: ${OCI_REGION}"
          mkdir -p docs/data/oci

      # ✅ NEW: enforce pricing-source-first contract
      - name: Validate OCI pricing source
        shell: bash
        run: |
          set -euo pipefail
          test -s scripts/providers/oci.pricing-source.json
          jq '.linux.amd_e4 and .linux.ampere_a1 and .windows and .storage.block_volume_gb_month' \
            scripts/providers/oci.pricing-source.json > /dev/null
          echo "OCI pricing source validated ✅"

      # ✅ Generate prices from source
      - name: Generate OCI prices from pricing source
        run: node scripts/providers/oci.fetch.js
        env:
          OCI_REGION: "us-ashburn-1"
          OUTPUT_PATH: "docs/data/oci/oci.prices.json"

      - name: Validate output
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/data/oci/oci.prices.json
          jq 'keys' docs/data/oci/oci.prices.json

      - name: Upload OCI pricing JSON (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: oci-prices
          path: docs/data/oci/oci.prices.json
          if-no-files-found: error
          retention-days: 7

      - name: Debug snapshot (optional)
        if: ${{ vars.DEBUG_PUBLISH == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/data/oci/_debug
          cp -f docs/data/oci/oci.prices.json docs/data/oci/_debug/oci.prices.json

      - name: Commit debug provider files (optional)
        if: ${{ vars.DEBUG_PUBLISH == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git add -f docs/data/oci/oci.prices.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Debug publish: OCI pricing update"
          git push
