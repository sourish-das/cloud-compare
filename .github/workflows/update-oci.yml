name: Fetch OCI Prices

permissions:
  contents: read        # provider does not commit; orchestrator/debug mode will
  id-token: write       # kept for parity with GCP (safe even if OCI fetcher doesn't use it)

on:
  workflow_call:
    outputs:
      run_id:
        description: "Run ID of this reusable workflow execution"
        value: ${{ github.run_id }}
  workflow_dispatch: {}

concurrency:
  group: provider-oci
  cancel-in-progress: true

jobs:
  fetch-oci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ensure jq (for quick validation)
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

      - name: Show config (debug)
        run: |
          echo "Region:   $OCI_REGION"
          echo "Currency: $OCI_CURRENCY"
          echo "Node:     $(node -v)"
        env:
          OCI_REGION: "us-ashburn-1"
          OCI_CURRENCY: "USD"

      # Pre-flight: create output dir (match GCP pattern)
      - name: Pre-flight checks
        shell: bash
        env:
          OCI_REGION: "us-ashburn-1"
          OCI_CURRENCY: "USD"
        run: |
          set -euo pipefail
          echo "== Pre-flight =="
          echo "Region:   ${OCI_REGION}"
          echo "Currency: ${OCI_CURRENCY}"
          mkdir -p docs/data/oci

      # Run fetcher (write directly to docs/data/oci)
      - name: Fetch OCI prices (FULL mode)
        run: node scripts/providers/oci.fetch.js
        env:
          OCI_REGION: "us-ashburn-1"
          OCI_CURRENCY: "USD"
          OUTPUT_PATH: "docs/data/oci/oci.prices.json"

      # Validate output (docs/data/oci)
      - name: Validate output
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/data/oci/oci.prices.json
          echo "Output size (bytes):"
          wc -c docs/data/oci/oci.prices.json
          echo "Top-level keys:"
          jq 'keys' docs/data/oci/oci.prices.json | sed 's/^/  /' || true
          echo "Storage block:"
          jq '.storage' docs/data/oci/oci.prices.json || true

      # Upload artifact (docs/data/oci)
      - name: Upload OCI pricing JSON (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: oci-prices
          path: docs/data/oci/oci.prices.json
          if-no-files-found: error
          retention-days: 7

      # =========================================
      # OPTIONAL DEBUG PUBLISH — mirrors GCP behavior
      # Only runs if vars.DEBUG_PUBLISH == 'true'
      # =========================================
      - name: Debug snapshot (optional)
        if: ${{ vars.DEBUG_PUBLISH == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/data/oci/_debug
          cp -f docs/data/oci/oci.prices.json docs/data/oci/_debug/oci.prices.json

      - name: Commit debug provider files (optional)
        if: ${{ vars.DEBUG_PUBLISH == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git add -f docs/data/oci/oci.prices.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Debug publish: OCI pricing update"
          git push
