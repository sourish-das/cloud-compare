name: Fetch OCI Prices

permissions:
  contents: read        # provider must NOT push
  id-token: write       # parity with GCP (safe, unused)

on:
  workflow_call:
    outputs:
      run_id:
        description: "Run ID of this reusable workflow execution"
        value: ${{ github.run_id }}
  workflow_dispatch: {}

concurrency:
  group: provider-oci
  cancel-in-progress: true

jobs:
  fetch-oci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # Node setup
      # ------------------------------------------------------------
      - name: Set up Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ------------------------------------------------------------
      # jq (validation)
      # ------------------------------------------------------------
      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

      # ------------------------------------------------------------
      # Pre-flight
      # ------------------------------------------------------------
      - name: Pre-flight checks
        shell: bash
        env:
          OCI_REGION: "us-ashburn-1"
        run: |
          set -euo pipefail
          echo "== Pre-flight =="
          echo "Region: ${OCI_REGION}"
          mkdir -p docs/data/oci

      # ------------------------------------------------------------
      # ✅ STEP 1: Validate OCI pricing SOURCE
      # ------------------------------------------------------------
      - name: Validate OCI pricing source
        shell: bash
        run: |
          set -euo pipefail
          test -s scripts/providers/oci.pricing-source.json

          jq '
            .linux.amd_e4 and
            .linux.ampere_a1 and
            .windows.license_per_vcpu_hour and
            .storage.block_volume_gb_month
          ' scripts/providers/oci.pricing-source.json > /dev/null

          echo "✅ OCI pricing source validated"

      # ------------------------------------------------------------
      # ✅ STEP 2: Generate OCI prices FROM source
      # ------------------------------------------------------------
      - name: Generate OCI prices from pricing source
        run: node scripts/providers/oci.fetch.js
        env:
          OCI_REGION: "us-ashburn-1"
          OUTPUT_PATH: "docs/data/oci/oci.prices.json"

      # ------------------------------------------------------------
      # Validate generated output
      # ------------------------------------------------------------
      - name: Validate OCI prices output
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/data/oci/oci.prices.json
          echo "Top-level keys:"
          jq 'keys' docs/data/oci/oci.prices.json

          echo "Storage block:"
          jq '.storage' docs/data/oci/oci.prices.json

      # ------------------------------------------------------------
      # Upload artifact (for update-all.yml)
      # ------------------------------------------------------------
      - name: Upload OCI pricing JSON (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: oci-prices
          path: docs/data/oci/oci.prices.json
          if-no-files-found: error
          retention-days: 7
