name: Fetch GCP Prices

permissions:
  contents: read        # provider does not commit; orchestrator will
  id-token: write       # required for google-github-actions/auth@v3

on:
  workflow_call:
    outputs:
      run_id:
        description: "Run ID of this reusable workflow execution"
        value: ${{ github.run_id }}
  workflow_dispatch: {}

concurrency:
  group: provider-gcp
  cancel-in-progress: true

jobs:
  fetch-gcp:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Checkout
      - name: Checkout repo (read-only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node
      - name: Set up Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # jq (simple validation)
      - name: Ensure jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

      # OIDC → short-lived Google Cloud access token
      - name: Google OIDC Auth
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}
          token_format: access_token

      # Ensure output directory
      - name: Ensure output directory
        run: mkdir -p docs/data/gcp

      # >>> Run the GCP fetcher
      - name: Fetch GCP prices
        run: node scripts/providers/gcp.fetch.js
        env:
          # Region & currency (adjust if needed)
          GCP_REGION: "us-east1"
          GCP_CURRENCY: "USD"

          # Project + access token for FULL-mode fallback & API calls
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCLOUD_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}

          # Optional: Catalog API key (the script prefers OAuth if present)
          GCP_PRICE_API_KEY: ${{ secrets.GCP_PRICE_API_KEY }}

          # Output path
          OUTPUT_PATH: "docs/data/gcp/gcp.prices.json"

          # Optional debug / knobs (leave commented for simplicity)
          # GCP_DEBUG_WIN: "1"                 # logs Windows rate resolution
          # GCP_FORCE_COMPOSE: "1"             # force compose Linux shapes
          # GCP_WINDOWS_RATE_PER_VCPU: "0.046" # pin Windows Standard per‑vCPU

      # Validate the output exists and show quick stats
      - name: Validate GCP output
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/data/gcp/gcp.prices.json
          echo "Output size (bytes):"
          wc -c docs/data/gcp/gcp.prices.json
          echo "Top-level keys:"
          jq 'keys' docs/data/gcp/gcp.prices.json | sed 's/^/  /' || true
          echo "Compute array length:"
          jq '.compute | length' docs/data/gcp/gcp.prices.json || true

      # Upload artifact for the orchestrator
      - name: Upload GCP pricing JSON (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: gcp-prices
          path: docs/data/gcp/gcp.prices.json
          if-no-files-found: error
          retention-days: 7
