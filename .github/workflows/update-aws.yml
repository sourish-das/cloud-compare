name: Fetch AWS Prices

permissions:
  contents: read          # provider does not commit; orchestrator will

on:
  workflow_call:
    outputs:
      run_id:
        description: "Run ID of this reusable workflow execution"
        value: ${{ github.run_id }}
  workflow_dispatch: {}

concurrency:
  group: provider-aws
  cancel-in-progress: true

jobs:
  fetch-aws:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ------------------------------------------------------------
      # Checkout (read-only)
      # ------------------------------------------------------------
      - name: Checkout repo (read-only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # Node setup (LTS)
      # ------------------------------------------------------------
      - name: Set up Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ------------------------------------------------------------
      # jq (for quick validation)
      # ------------------------------------------------------------
      - name: Ensure jq (for quick validation)
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

      # ------------------------------------------------------------
      # Optional: quick probe against AWS Price List (no auth required)
      # ------------------------------------------------------------
      - name: Probe AWS Price List API (sample)
        shell: bash
        env:
          AWS_REGION: "us-east-1"
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /tmp/aws-price.json -w "%{http_code}" \
            "https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonEC2/current/${AWS_REGION}/index.json")
          echo "AWS Price List probe HTTP: ${CODE}"
          if [[ "${CODE}" != "200" ]]; then
            echo "::warning::AWS Price List probe failed (HTTP ${CODE}). Continuing..."
          else
            echo "Top-level keys (truncated):"
            jq 'keys' /tmp/aws-price.json | head -n 20 || true
          fi

      # ------------------------------------------------------------
      # Ensure output directory
      # ------------------------------------------------------------
      - name: Ensure output directory
        run: mkdir -p docs/data/aws

      # ------------------------------------------------------------
      # >>> Run the AWS fetcher (Windows via catalog; fallback uplift if needed)
      # ------------------------------------------------------------
      - name: Fetch AWS prices
        run: node scripts/providers/aws.fetch.js
        env:
          AWS_REGION: "us-east-1"
          OUTPUT_PATH: "docs/data/aws/aws.prices.json"

          # Optional Windows uplift (default = 0.046)
          # AWS_WINDOWS_RATE_PER_VCPU: "0.046"

          # NEW: correct RHEL uplift (default fallback in code now ~0.0168)
          AWS_RHEL_RATE_PER_VCPU: "0.0168"

      # ------------------------------------------------------------
      # Validate the output was created and show quick stats
      # ------------------------------------------------------------
      - name: Validate AWS output
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/data/aws/aws.prices.json
          echo "Output size (bytes):"
          wc -c docs/data/aws/aws.prices.json
          echo "Top-level keys:"
          jq 'keys' docs/data/aws/aws.prices.json | sed 's/^/  /' || true
          echo "Compute array length:"
          jq '.compute | length' docs/data/aws/aws.prices.json || true
          echo "Counts by OS:"
          jq -r '.compute | group_by(.os) | map({os: .[0].os, count: length})' docs/data/aws/aws.prices.json

      # ------------------------------------------------------------
      # Upload artifact for orchestrator
      # ------------------------------------------------------------
      - name: Upload AWS pricing JSON (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: aws-prices
          path: docs/data/aws/aws.prices.json
          if-no-files-found: error
          retention-days: 7

      # =========================================
      # OPTIONAL DEBUG MODE — snapshot to docs/data (no direct overwrite)
      # Enable by setting repo variable: DEBUG_PUBLISH=true
      # =========================================
      - name: Debug Publish to docs/data (optional)
        if: ${{ vars.DEBUG_PUBLISH == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "DEBUG MODE ENABLED: Publishing AWS output directly to docs/data/aws"
          mkdir -p docs/data/aws/_debug
          cp -f docs/data/aws/aws.prices.json docs/data/aws/_debug/aws.prices.json

      - name: Commit debug provider files (optional)
        if: ${{ vars.DEBUG_PUBLISH == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          git add -f docs/data/aws/aws.prices.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Debug publish: AWS pricing update"
          git push
